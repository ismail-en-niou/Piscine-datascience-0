services:
  db:
    image: postgres:18
    container_name: postgres-dev-2
    environment:
      - POSTGRES_DB_FILE=/run/secrets/POSTGRES_DB
      - POSTGRES_USER_FILE=/run/secrets/POSTGRES_USER
      - POSTGRES_PASSWORD_FILE=/run/secrets/POSTGRES_PASSWORD
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    secrets:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    restart: unless-stopped
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4:9.8
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_PASSWORD_FILE=/run/secrets/PGADMIN_DEFAULT_PASSWORD
    secrets:
      - PGADMIN_DEFAULT_EMAIL
      - PGADMIN_DEFAULT_PASSWORD
    entrypoint: ["/bin/sh", "-c", "export PGADMIN_DEFAULT_EMAIL=\"$$(cat /run/secrets/PGADMIN_DEFAULT_EMAIL)\" && exec /entrypoint.sh"]
    depends_on:
      - db
    networks:
      - app-network
    

volumes:
  postgres_data:

secrets:
  POSTGRES_DB:
    file: ./secrets/POSTGRES_DB.txt
  POSTGRES_USER:
    file: ./secrets/POSTGRES_USER.txt
  POSTGRES_PASSWORD:
    file: ./secrets/POSTGRES_PASSWORD.txt
  PGADMIN_DEFAULT_EMAIL:
    file: ./secrets/PGADMIN_DEFAULT_EMAIL.txt
  PGADMIN_DEFAULT_PASSWORD:
    file: ./secrets/PGADMIN_DEFAULT_PASSWORD.txt

networks:
  app-network:
    driver: bridge